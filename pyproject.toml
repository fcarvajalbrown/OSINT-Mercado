[project]
name = "osint-mercado"
version = "0.1.0"
description = "Audit Chilean municipal procurement for overpricing"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "truststore>=0.9",
    "polars>=1.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0",
    "stellar-sdk>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.6"]

[project.scripts]
osint-ingest = "osint_mercado.ingest:main"
osint-build-baselines = "osint_mercado.build_baselines:main"
osint-score = "osint_mercado.score:main"
osint-cm-score = "osint_mercado.cm_score:main"
osint-peer-score = "osint_mercado.peer_score:main"
osint-catalog = "osint_mercado.catalog:main"
osint-curate = "osint_mercado.curate:main"
osint-build-site = "osint_mercado.build_site:main"
osint-anchor = "osint_mercado.anchor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
