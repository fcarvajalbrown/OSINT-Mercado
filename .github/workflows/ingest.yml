name: ingest

on:
  schedule:
    - cron: "0 12 * * *"  # daily 12:00 UTC (about 08:00 Chile time)
  workflow_dispatch:
    inputs:
      fecha:
        description: "date ddmmaaaa (default: yesterday)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit the refreshed pending queue + fx cache back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Compute fecha
        id: d
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            echo "fecha=${{ github.event.inputs.fecha }}" >> "$GITHUB_OUTPUT"
          else
            echo "fecha=$(date -u -d yesterday +%d%m%Y)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ingestion
        env:
          CHILECOMPRA_API_TICKET: ${{ secrets.CHILECOMPRA_API_TICKET }}
        run: osint-ingest --fecha "${{ steps.d.outputs.fecha }}" --codes data/rm_municipal_codes.json --out data --max-per-organism 200 --pace 0.25
      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: oc-items-${{ steps.d.outputs.fecha }}
          path: data/*.parquet
          if-no-files-found: warn
      # Score the freshly ingested dataset into the pending review queue. Deploy stays
      # manual (workflow_dispatch in build-deploy.yml): scoring never auto-publishes, so the
      # human curation gate (ADR 0006) is never bypassed.
      - name: Score into pending queue
        run: osint-score --items "data/oc_items_${{ steps.d.outputs.fecha }}.parquet" --out data/pending_anomalies.json --fx-cache data/fx_rates.json
      - name: Commit refreshed pending queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_anomalies.json data/fx_rates.json
          if git diff --cached --quiet; then
            echo "no changes to pending queue"
          else
            git commit -m "data(pipeline): refresh pending anomalies for ${{ steps.d.outputs.fecha }}"
            # Rebase onto any commits pushed during the (long) run, then push.
            git pull --rebase origin master
            git push
          fi
