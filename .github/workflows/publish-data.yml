name: publish-data

# Rebuild the published flags dataset whenever the confirmed set (or basket) changes.
# The Hostinger cron then pulls published/flags.json via refresh.php. Only confirmed
# flags reach this file, so the human curation gate (ADR 0006) is never bypassed.
on:
  push:
    branches: [master]
    paths:
      - data/confirmed_flags.json
      - data/basket.json
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Build published flags
        run: |
          osint-build-site --confirmed data/confirmed_flags.json --out dist
          mkdir -p published
          cp dist/data/flags.json published/flags.json
      - name: Commit published/flags.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/flags.json
          if git diff --cached --quiet; then
            echo "published flags unchanged"
          else
            git commit -m "data(publish): rebuild published flags"
            git push
          fi
