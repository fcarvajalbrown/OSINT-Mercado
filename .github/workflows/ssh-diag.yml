name: ssh-diag

# Temporary one-shot: remove the stray dashboard copy from the unused ~/public_html
# (left by the first mistargeted deploy). Removes only the exact files we put there.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ vars.SSH_HOST != '' }}
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Remove stray files from ~/public_html
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_HOSTINGER }}
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" '
              cd ~/public_html || exit 0;
              rm -f app.js index.html styles.css;
              rm -rf data;
              echo "cleaned ~/public_html; remaining:";
              ls -la
            '
