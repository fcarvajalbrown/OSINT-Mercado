name: ssh-diag

# Temporary read-only diagnostic: find the real web docroot on the Hostinger account.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    if: ${{ vars.SSH_HOST != '' }}
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Inspect remote layout
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_HOSTINGER }}
        run: |
          sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" '
              echo "HOME=$HOME";
              echo "=== ~ ==="; ls -la ~;
              echo "=== ~/public_html ==="; ls -la ~/public_html 2>/dev/null;
              echo "=== ~/domains ==="; ls -la ~/domains 2>/dev/null;
              for d in ~/domains/*/; do echo "== $d =="; ls -la "$d" 2>/dev/null; echo "== ${d}public_html =="; ls -la "${d}public_html" 2>/dev/null; done
            '
